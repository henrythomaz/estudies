services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    env_file:
      - .env
    environment:
      DOCKER: "true"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: "development"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.yarn
volumes:
  pgdata:
